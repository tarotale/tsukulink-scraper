name: Tsukulink Auto Scraper

on:
  workflow_dispatch: # GitHubの画面から手動でボタンを押して起動する設定

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        # 同時に走らせたい都道府県を指定（ここで複数指定すると並列で動きます）
        prefecture: ["大阪府", "兵庫県", "京都府"]
      fail-fast: false
      max-parallel: 2 # 🔴 ボット対策：同時に立ち上がるサーバー（IP）を最大2台に制限

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Run Scraper
      run: |
        python tsukulink_bot.py "${{ matrix.prefecture }}"

    - name: Upload CSV Artifact
      uses: actions/upload-artifact@v4
      if: always() # 途中でエラーが起きても、そこまでに作られたCSVは必ず回収する
      with:
        name: tsukulink_result_${{ matrix.prefecture }}
        path: tsukulink_*.csv
