name: Tsukulink Split Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          # 大阪府の担当区域を5分割（計250ページ分）に拡張
          - prefecture: "京都府"
            start_page: 551
            end_page: 600
          - prefecture: "京都府"
            start_page: 601
            end_page: 650
          - prefecture: "京都府"
            start_page: 651
            end_page: 700
          - prefecture: "京都府"
            start_page: 701
            end_page: 750
          - prefecture: "京都府"
            start_page: 751
            end_page: 812
            
      fail-fast: false
      max-parallel: 5 # 同時起動を5台に引き上げ

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium requests  # Slack送信に必要なrequestsもここで確実にインストール

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    # 🟢 【リスク対策】5台が一斉にサイトへ突撃するのを防ぐため、0〜45秒のランダムな時間差を作って出撃させる
    - name: Random Delay to Bypass Bot Detection
      run: |
        DELAY=$((RANDOM % 46))
        echo "サーバーの同時衝突を防ぐため、${DELAY}秒間 待機してから出撃します..."
        sleep $DELAY

    # 🟢 【安全連携】GitHubの金庫（Secrets）からSlackのトークンとチャンネルIDを安全に読み込み、Pythonに渡して実行
    - name: Run Scraper
      env:
        SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
      run: |
        python tsukulink_bot.py "${{ matrix.prefecture }}" "${{ matrix.start_page }}" "${{ matrix.end_page }}"
