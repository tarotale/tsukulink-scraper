name: Tsukulink Split Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          # 大阪府の担当区域を分割してセット
          - prefecture: "大阪府"
            start_page: 1
            end_page: 50
          - prefecture: "大阪府"
            start_page: 51
            end_page: 100
          - prefecture: "大阪府"
            start_page: 101
            end_page: 150
            
      fail-fast: false
      max-parallel: 2 # 同時起動は安全のため最大2台までに制限

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    - name: Run Scraper
      run: |
        python tsukulink_bot.py "${{ matrix.prefecture }}" "${{ matrix.start_page }}" "${{ matrix.end_page }}"

    - name: Upload CSV Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tsukulink_result_${{ matrix.prefecture }}_page${{ matrix.start_page }}-${{ matrix.end_page }}
        path: tsukulink_*.csv
