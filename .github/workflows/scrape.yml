name: Tsukulink Split Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          # 大阪府の担当区域を5分割（計250ページ分）に拡張
          - prefecture: "奈良県"
            start_page: 1
            end_page: 50
          - prefecture: "奈良県"
            start_page: 51
            end_page: 100
          - prefecture: "奈良県"
            start_page: 101
            end_page: 150
          - prefecture: "奈良県"
            start_page: 151
            end_page: 200
          - prefecture: "奈良県"
            start_page: 201
            end_page: 250
            
      fail-fast: false
      max-parallel: 5 # 💥 同時起動を5台に引き上げ

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install selenium

    - name: Install Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable

    # 🟢 【リスク対策】5台が一斉にサイトへ突撃するのを防ぐため、0〜45秒のランダムな時間差を作って出撃させる
    - name: Random Delay to Bypass Bot Detection
      run: |
        DELAY=$((RANDOM % 46))
        echo "サーバーの同時衝突を防ぐため、${DELAY}秒間 待機してから出撃します..."
        sleep $DELAY

    - name: Run Scraper
      run: |
        python tsukulink_bot.py "${{ matrix.prefecture }}" "${{ matrix.start_page }}" "${{ matrix.end_page }}"

    - name: Upload CSV Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: tsukulink_result_${{ matrix.prefecture }}_page${{ matrix.start_page }}-${{ matrix.end_page }}
        path: tsukulink_*.csv
